---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy. Run 'go mod tidy' and commit the changes." && exit 1)
          go mod verify

      - name: Verify docs are up to date
        run: |
          go run ./tools/docgen/
          git diff --exit-code docs/usage/ || (echo "error: docs out of date — run 'go run ./tools/docgen/' and commit changes" && exit 1)

      - name: Run Tests & Enforce Coverage
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total Coverage: $TOTAL_COVERAGE%"
          if (( $(echo "$TOTAL_COVERAGE < 90.0" | bc -l) )); then
            echo "Error: Test coverage ($TOTAL_COVERAGE%) is below the required 90% threshold."
            exit 1
          fi

      - name: Complexity gate (gocognit/gocyclo ≤15)
        run: |
          go install github.com/uudashr/gocognit/cmd/gocognit@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          FILES=$(find internal/ cmd/ -name '*.go' ! -name '*_test.go')
          if [ -n "$FILES" ]; then
            VIOLATIONS=$(gocognit -over 15 $FILES 2>&1; gocyclo -over 15 $FILES 2>&1)
            if [ -n "$VIOLATIONS" ]; then
              echo "Error: complexity >15 in non-test code:"
              echo "$VIOLATIONS"
              exit 1
            fi
          fi

      - name: File-size gate (≤1000 lines)
        run: |
          OVERSIZED=$(find internal/ cmd/ -name '*.go' -print0 | xargs -0 wc -l | awk '$1>1000 && $2!="total"')
          if [ -n "$OVERSIZED" ]; then
            echo "Error: files exceeding 1000 lines:"
            echo "$OVERSIZED"
            exit 1
          fi

  lint-commits:
    name: Conventional Commits
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commits follow Conventional Commits
        run: |
          FOUND_VALID=false

          while read -r line; do
            if echo "$line" | grep -qE '^(feat|fix|chore|docs|test|refactor|perf|ci|build|style)(\(.+\))?!?: .+'; then
              echo "✓ Valid commit: $line"
              FOUND_VALID=true
            else
              echo "ℹ Skipping non-conventional commit: $line"
            fi
          done < <(git log --format="%s" origin/${{ github.event.pull_request.base.ref }}..HEAD)

          if [ "$FOUND_VALID" = false ]; then
            echo "✗ No commits follow Conventional Commits format (type(scope): description)"
            echo "Valid types: feat, fix, chore, docs, test, refactor, perf, ci, build, style"
            exit 1
          fi

  security:
    name: Security Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sonarcloud:
    name: SonarCloud Analysis
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
