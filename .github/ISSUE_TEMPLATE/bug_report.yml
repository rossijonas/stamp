name: Bug report
description: Report a problem with stamp
title: "[Bug]: "
labels: ["bug", "needs-triage"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/rossijonas/stamp/issues?q=is%3Aissue) first, and **redact** tokens, API keys, and personal paths from anything you paste.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `stamp ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: stamp version
      description: Output of `stamp --version`.
      placeholder: "v0.38.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and distribution
      description: e.g. Fedora 42, Ubuntu 24.04, macOS 15 (arm64).
      placeholder: "Fedora 42"
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Package manager(s) involved
      description: e.g. dnf, apt, brew, flatpak, pacman, zypper.
      placeholder: "dnf"
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: How was stamp installed?
      description: Install script, release tarball, `go install`, Homebrew tap, distro package, etc.
      placeholder: "Install script"
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: stamp doctor --json
      description: Paste the output of `stamp doctor --json`. Redact tokens, API keys, and personal paths.
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Any additional output. Redact secrets and personal paths. Drag in a file if it is too long.
      render: shell
    validations:
      required: false
