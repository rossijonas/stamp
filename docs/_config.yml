theme: null

title: Stamp
tagline: A lightweight yet powerful tool that wraps many package managers into one
description: >-
  A lightweight yet powerful tool that wraps many package managers into one.
  Install, track, and restore without changing your tools.
  One manifest. One command to restore it all.
url: "https://gostamp.dev"
author: rossijonas

social:
  name: Stamp
  links:
    - https://github.com/rossijonas/stamp

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md

# Default front matter for all markdown files
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: "index.html"
    values:
      layout: "default"
  - scope:
      path: "decisions"
    values:
      layout: "page"
